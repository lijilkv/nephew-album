<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Photo Album</title>
  <style>
    :root {
      --bg: #fdf8f2;
      --card: #ffffff;
      --ink: #2f2626;
      --muted: #756868;
      --accent: #e07a5f;
      --navy: #3d405b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
    }

    /* Login Screen */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .login-card h2 { margin: 0 0 6px; font-size: 1.4rem; }
    .login-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .err-msg { color: #c0392b; font-size: 13px; margin-bottom: 10px; display: none; }

    /* Sticky Top Navigation Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(253, 248, 242, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #eadfce;
      padding: 12px 18px;
    }
    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .upload-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fae8e2;
      cursor: pointer;
    }
    .upload-link:hover { background: #f5d8ce; }

    input, button {
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid #dcd0c0;
      font-size: 14px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: var(--navy); }
    button.ghost { background: #efe6da; color: var(--ink); }

    /* Main Content */
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }
    .polaroid {
      position: relative;
      background: var(--card);
      padding: 10px 10px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
    }
    .polaroid img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      cursor: zoom-in;
      background: #f3ece2;
    }
    .del-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 4px 9px;
      font-size: 12px;
      border-radius: 99px;
    }
    .caption {
      margin: 9px 2px 0;
      font-size: 14px;
      color: #554a4a;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      max-width: 460px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
    }

    /* Dynamic Slideshow View */
    .slideshow-box {
      max-width: 860px;
      margin: 10px auto;
      background: #1d1a1a;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.2);
    }
    .slideshow-box img {
      width: 100%;
      height: 70vh;
      object-fit: contain;
      display: block;
      transition: opacity 0.4s ease;
    }
    .slide-caption {
      color: #f5efe6;
      padding: 12px 16px;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.6);
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 16, 0.65);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 16px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { margin-top: 0; font-size: 1.25rem; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .preview-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .preview-strip img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .lightbox img { max-width: 92vw; max-height: 85vh; border-radius: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- LOGIN VIEW -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <h2>📸 Family Album Login</h2>
      <p>Sign in to view and upload memories</p>
      <div class="err-msg" id="loginErr">Invalid username or password</div>
      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" id="loginUser" required autocomplete="username" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPass" required autocomplete="current-password" />
        </div>
        <button type="submit" style="width: 100%; margin-top: 6px;">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ALBUM VIEW -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="albumTitle">📸 Our Little Adventures</h1>
        <div class="nav-actions">
          <a href="#upload" class="upload-link" onclick="event.preventDefault(); openModal('addModal')">+ Upload Photos</a>
          <button class="ghost" id="viewModeBtn" onclick="toggleViewMode()">🎞 Slideshow</button>
          <button class="secondary" id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button>
          <button class="ghost" onclick="openModal('settingsModal')" title="Settings">⚙️</button>
          <button class="ghost" onclick="logout()">Logout</button>
        </div>
      </div>
    </header>

    <main id="galleryContainer"></main>
  </div>

  <!-- Bulk Upload Modal -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h2>Upload Photos</h2>
      <form id="photoForm">
        <div class="field">
          <label>Select Photos (up to 30 at once)</label>
          <input type="file" id="photoFiles" name="photos" accept="image/*" multiple required onchange="previewSelected()" />
          <div class="preview-strip" id="previewStrip"></div>
        </div>
        <div class="field">
          <label>Caption (optional — applies to this batch)</label>
          <input type="text" name="caption" placeholder="e.g., Weekend trip, Birthday fun..." />
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost" onclick="closeModal('addModal')">Cancel</button>
          <button type="submit" id="saveBtn">Upload Batch</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings & Music Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h2>Album Title & Music</h2>
      <form id="settingsForm">
        <div class="field">
          <label>Album Title</label>
          <input type="text" id="setTitle" />
        </div>
        <div class="modal-actions">
          <button type="submit">Save Title</button>
        </div>
      </form>
      <hr style="margin: 18px 0; border: none; border-top: 1px solid #eee;" />
      <form id="musicForm">
        <div class="field">
          <label>Background Music (MP3 / M4A)</label>
          <input type="file" name="track" accept="audio/*" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost" onclick="closeModal('settingsModal')">Close</button>
          <button type="submit" class="secondary" id="musicUploadBtn">Upload Music</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Fullscreen Lightbox -->
  <div class="modal-backdrop lightbox" id="lightboxModal" onclick="closeModal('lightboxModal')">
    <img id="lightboxImg" src="" alt="Full view" />
  </div>

  <audio id="bgAudio" loop></audio>

  <script>
    let album = { title: 'Our Little Adventures', photos: [], music: null };
    let slideshowMode = false;
    let slideIndex = 0;
    let slideTimer = null;

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function viewFull(url) {
      document.getElementById('lightboxImg').src = url;
      openModal('lightboxModal');
    }

    async function checkAuth() {
      const res = await fetch('/api/me');
      const data = await res.json();
      if (data.authenticated) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        loadAlbum();
      } else {
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('appView').classList.add('hidden');
      }
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginErr');
      errEl.style.display = 'none';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('loginUser').value,
          password: document.getElementById('loginPass').value,
        }),
      });
      if (res.ok) {
        e.target.reset();
        checkAuth();
      } else {
        errEl.style.display = 'block';
      }
    };

    async function logout() {
      clearInterval(slideTimer);
      await fetch('/api/logout', { method: 'POST' });
      checkAuth();
    }

    async function loadAlbum() {
      const res = await fetch('/api/album');
      if (res.status === 401) return checkAuth();
      album = await res.json();
      document.getElementById('albumTitle').textContent = `📸 ${album.title}`;
      document.getElementById('setTitle').value = album.title;
      if (album.music) {
        const audio = document.getElementById('bgAudio');
        if (audio.src !== album.music) audio.src = album.music;
      }
      renderGallery();
    }

    function toggleViewMode() {
      slideshowMode = !slideshowMode;
      document.getElementById('viewModeBtn').textContent = slideshowMode ? '⊞ Grid View' : '🎞 Slideshow';
      clearInterval(slideTimer);
      if (slideshowMode && album.photos.length > 0) {
        slideIndex = 0;
        slideTimer = setInterval(() => {
          slideIndex = (slideIndex + 1) % album.photos.length;
          renderGallery();
        }, 3500);
      }
      renderGallery();
    }

    function renderGallery() {
      const container = document.getElementById('galleryContainer');
      if (!album.photos || album.photos.length === 0) {
        container.innerHTML = `<div class="empty"><h3>No photos yet</h3><p>Click <strong>+ Upload Photos</strong> in the top bar to add a batch of memories.</p></div>`;
        return;
      }

      if (slideshowMode) {
        const p = album.photos[slideIndex % album.photos.length];
        container.innerHTML = `
          <div class="slideshow-box">
            <img src="${p.url}" alt="Slideshow" />
            <div class="slide-caption">${p.caption || `Photo ${slideIndex + 1} of ${album.photos.length}`}</div>
          </div>`;
        return;
      }

      container.innerHTML = `<div class="grid">${album.photos.map((p) => `
        <div class="polaroid">
          <button class="del-btn" onclick="deletePhoto(${p.id})" title="Delete">✕</button>
          <img src="${p.url}" alt="Memory" loading="lazy" onclick="viewFull('${p.url}')" />
          ${p.caption ? `<p class="caption">${p.caption}</p>` : ''}
        </div>
      `).join('')}</div>`;
    }

    function previewSelected() {
      const strip = document.getElementById('previewStrip');
      const files = document.getElementById('photoFiles').files;
      strip.innerHTML = Array.from(files).map((f) => `<img src="${URL.createObjectURL(f)}" />`).join('');
    }

    document.getElementById('photoForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      const count = document.getElementById('photoFiles').files.length;
      btn.disabled = true;
      btn.textContent = `Uploading ${count} photo(s)...`;
      try {
        await fetch('/api/photos', { method: 'POST', body: new FormData(e.target) });
        e.target.reset();
        document.getElementById('previewStrip').innerHTML = '';
        closeModal('addModal');
        await loadAlbum();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Batch';
      }
    };

    async function deletePhoto(id) {
      if (!confirm('Remove this photo?')) return;
      await fetch(`/api/photos/${id}`, { method: 'DELETE' });
      loadAlbum();
    }

    document.getElementById('settingsForm').onsubmit = async (e) => {
      e.preventDefault();
      await fetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: document.getElementById('setTitle').value }),
      });
      closeModal('settingsModal');
      loadAlbum();
    };

    document.getElementById('musicForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('musicUploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      try {
        await fetch('/api/music', { method: 'POST', body: new FormData(e.target) });
        e.target.reset();
        closeModal('settingsModal');
        await loadAlbum();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Music';
      }
    };

    function toggleMusic() {
      const audio = document.getElementById('bgAudio');
      const btn = document.getElementById('musicBtn');
      if (!album.music) { openModal('settingsModal'); return; }
      if (audio.paused) { audio.play(); btn.textContent = '⏸ Pause Music'; }
      else { audio.pause(); btn.textContent = '🎵 Play Music'; }
    }

    checkAuth();
  </script>
</body>
</html>
